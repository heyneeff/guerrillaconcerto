<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guerrilla Concerto</title>
<link id="favicon" rel="icon" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dancing-queen: #FFC8B0;
    --yellow-sub:    #F4B608;
    --kiss-quick:    #FF4F00;
    --purple-haze:   #EBAEED;
    --waterloo:      #B2D8D8;
    --sweet-leaf:    #00492B;
    --dreams:        #F7EFE2;
    --black:         #000000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--dreams); color: var(--black);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; cursor: none;
  }

  /* CURSOR */
  .cursor-dot { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: var(--black); pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); }
  .confetti-p { position: fixed; pointer-events: none; z-index: 9998; animation: cfFall 0.8s ease-out forwards; }
  @keyframes cfFall { 0% { transform: translate(0,0) rotate(0deg) scale(1); opacity:1; } 100% { transform: translate(var(--dx),40px) rotate(720deg) scale(0); opacity:0; } }

  /* BANZAI QUOTE — plain orange text, no background */
  #secretQuote {
    position: fixed; bottom: 5rem; left: 50%;
    transform: translateX(-50%) rotate(-1.5deg);
    color: var(--kiss-quick);
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(1.1rem, 2.2vw, 1.8rem);
    text-transform: uppercase; letter-spacing: 0.04em;
    white-space: pre-line; text-align: center;
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease; max-width: 88vw;
  }
  #secretQuote.show { opacity: 1; }

  /* HEADER */
  header {
    padding: 1.5rem 4vw;
    display: flex; align-items: center;
    justify-content: space-between;
    
  }

  /* WORDMARK */
  .logo {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(1.6rem, 2.8vw, 2.4rem);
    text-transform: uppercase; letter-spacing: 0.01em;
    line-height: 0.92; color: var(--black); text-decoration: none;
  }
  .logo-row { display: block; }
  .logo-row.spread { letter-spacing: 0.105em; }
  .letter { display: inline-block; transition: color 0.15s ease; }

  /* MASCOT — right side, larger */
  #mascot {
    width: 90px; height: 90px; flex-shrink: 0;
    cursor: none; display: flex; align-items: center; justify-content: center;
  }
  #mascotImg {
    width: 100%; height: 100%; object-fit: contain;
    animation: mascotBob 4s ease-in-out infinite;
    transform-origin: bottom center;
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes mascotBob { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-4px) rotate(0.6deg);} }
  #mascot:hover #mascotImg { animation: none; transform: rotate(-10deg) scale(1.18); }

  /* PORTFOLIO */
  main { padding: 2rem 0 0; }
  .work {
    display: block; text-decoration: none; color: var(--black);
    padding: 2rem 4vw; cursor: none;
    transition: background 0.35s ease, color 0.35s ease, padding 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .work-title {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(3rem, 11vw, 11rem);
    text-transform: uppercase; line-height: 0.9; letter-spacing: -0.015em;
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
    transform-origin: left center;
  }
  .work-title .small { font-size: 0.4em; vertical-align: 0.9em; letter-spacing: 0.05em; margin-left: 0.15em; }
  .work-meta {
    margin-top: 0.75rem; display: flex; align-items: center; gap: 1.5rem;
    font-weight: 600; font-size: clamp(0.9rem, 1.2vw, 1.1rem);
    text-transform: uppercase; letter-spacing: 0.12em;
    opacity: 0.7; transition: opacity 0.3s ease;
  }
  .work-meta .arrow {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(1.3rem, 1.8vw, 1.6rem);
    transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .work.csi:hover    { background: var(--kiss-quick); color: var(--dreams); }
  .work.dg:hover     { background: var(--sweet-leaf); color: var(--dancing-queen); }
  .work.byob:hover   { background: var(--yellow-sub); color: var(--black); }
  .work.diary:hover  { background: var(--waterloo);   color: var(--black); }
  .work:hover .work-title  { transform: translateX(0.5rem); }
  .work:hover .work-meta   { opacity: 1; }
  .work:hover .work-meta .arrow { transform: translateX(0.6rem); }

  /* FOOTER */
  footer {
    
    padding: 3rem 4vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 0.5rem;
    margin-top: 4rem;
  }
  .foot-studio {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(0.9rem, 1.4vw, 1.15rem);
    text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--black);
  }
  .foot-rotating {
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--kiss-quick);
    min-height: 1.4em;
    transition: opacity 0.4s ease;
  }

  @media (max-width: 800px) {
    header { padding: 1rem 5vw; }
    #mascot { width: 68px; height: 68px; }
    .work { padding: 1.5rem 5vw; }
    .work-title { font-size: clamp(2.5rem, 14vw, 5rem); }
    .work-meta { gap: 1rem; font-size: 0.75rem; letter-spacing: 0.1em; }
  }
</style>
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div id="secretQuote"></div>

<header>
  <a href="/" class="logo" aria-label="Guerrilla Concerto">
    <span class="logo-row" id="row1"></span>
    <span class="logo-row spread" id="row2"></span>
  </a>
  <div id="mascot"><img id="mascotImg" src="" alt="Guerrilla Concerto mascot"></div>
</header>

<main>
  <a class="work csi" href="https://carnivalsociety.org">
    <h2 class="work-title">Carnival Society<span class="small">Intl.</span></h2>
    <div class="work-meta">
      <span>A Collective of Pageantry and Delight</span>
      <span class="arrow">&rarr;</span>
    </div>
  </a>

  <a class="work dg" href="https://divinersguild.net">
    <h2 class="work-title">Diviner's Guild</h2>
    <div class="work-meta">
      <span>An Organization of Insight and Farsight</span>
      <span class="arrow">&rarr;</span>
    </div>
  </a>

  <a class="work byob" href="https://boombox.productions">
    <h2 class="work-title">BYO Boombox</h2>
    <div class="work-meta">
      <span>Anarcho Party Tech</span>
      <span class="arrow">&rarr;</span>
    </div>
  </a>

  <a class="work diary" href="https://diarylibrary.org">
    <h2 class="work-title">Diary Library</h2>
    <div class="work-meta">
      <span>An Institution of Inner States</span>
      <span class="arrow">&rarr;</span>
    </div>
  </a>
</main>

<footer>
  <div class="foot-studio">The Collaborative Studio of NEEFF</div>
  <div class="foot-rotating" id="footRotating"></div>
</footer>

  ];

  // Mascot
  const mascotImg = document.getElementById('mascotImg');
  const favicon = document.getElementById('favicon');
  function pick() { return GORILLAS[Math.floor(Math.random() * GORILLAS.length)]; }
  let cur = pick();
  mascotImg.src = cur;
  if (favicon) favicon.href = cur;

  // Banzai — 7 clicks
  const QUOTES = [
    "Wherever you go,\nthere you are.",
    "Laugh while you can,\nmonkey-boy.",
    "Why is there a watermelon there?\n— I'll tell you later.",
    "Hey hey hey hey,\ndon't be mean.",
    "No matter where you go,\nthere you are."
  ];
  let clicks = 0;
  document.getElementById('mascot').addEventListener('click', e => {
    e.preventDefault();
    let next = cur;
    while (next === cur && GORILLAS.length > 1) next = pick();
    mascotImg.src = cur = next;
    if (favicon) favicon.href = next;
    if (++clicks === 7) {
      const el = document.getElementById('secretQuote');
      el.textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5500);
      clicks = 0;
    }
  });

  // Letter twitch
  const COLORS = ['#FF4F00','#F4B608','#EBAEED','#B2D8D8','#FFC8B0','#00492B'];
  ['GUERRILLA','CONCERTO'].forEach((word, i) => {
    document.getElementById(i ? 'row2' : 'row1').innerHTML =
      word.split('').map(l => `<span class="letter">${l}</span>`).join('');
  });
  const letters = [...document.querySelectorAll('.letter')];
  function twitch() {
    for (let i = 0; i < Math.floor(Math.random()*3)+1; i++) {
      const l = letters[~~(Math.random()*letters.length)];
      l.style.color = COLORS[~~(Math.random()*COLORS.length)];
      setTimeout(() => l.style.color = '', 300 + Math.random()*400);
    }
    setTimeout(twitch, 900 + Math.random()*2400);
  }
  setTimeout(twitch, 1800);

  // Rotating footer text
  const footPhrases = ['Fellowship Technologies', 'Aquarian Arts', 'Anarcho-Modalities'];
  let footIdx = 0;
  const footEl = document.getElementById('footRotating');
  footEl.textContent = footPhrases[0];
  setInterval(() => {
    footEl.style.opacity = '0';
    setTimeout(() => {
      footIdx = (footIdx + 1) % footPhrases.length;
      footEl.textContent = footPhrases[footIdx];
      footEl.style.opacity = '1';
    }, 400);
  }, 3000);

  // Confetti cursor
  const dot = document.getElementById('cursorDot');
  const CC = ['#FF4F00','#F4B608','#EBAEED','#B2D8D8','#FFC8B0'];
  let lx=0, ly=0, lt=0;
  document.addEventListener('mousemove', e => {
    dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
    const now = Date.now(), speed = Math.hypot(e.clientX-lx, e.clientY-ly);
    if (speed > 8 && now-lt > 40) {
      const p = document.createElement('div');
      p.className = 'confetti-p';
      const sz = 4+Math.random()*6;
      p.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:${sz}px;height:${sz}px;background:${CC[~~(Math.random()*CC.length)]};border-radius:${Math.random()>.5?'50%':'2px'};--dx:${Math.random()*40-20}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
      lt = now;
    }
    lx = e.clientX; ly = e.clientY;
  });
</script>
